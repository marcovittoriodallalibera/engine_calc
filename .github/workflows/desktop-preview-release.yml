name: Desktop preview release

on:
  push:
    tags:
      - "v*-preview.*"

permissions:
  contents: read

concurrency:
  group: desktop-preview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Verify preview on Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          architecture: x64
          package-manager-cache: false

      - name: Validate preview tag
        run: node scripts/check-preview-tag.mjs "$env:GITHUB_REF_NAME"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run complete test suite
        run: npm test

      - name: Ensure source tree remains clean
        shell: pwsh
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          if (git ls-files --others --exclude-standard) {
            throw "The release build created untracked source files."
          }

      - name: Build installer and portable executable
        run: npm run desktop:dist:win

      - name: Verify packages natively
        shell: pwsh
        run: >-
          ./scripts/verify-windows-package.ps1
          -DistDir desktop-dist
          -ExpectedSignature NotSigned

      - name: Upload verified Windows inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-windows-x64-${{ github.sha }}
          path: |
            desktop-dist/Phase-360-Setup-*-x64.exe
            desktop-dist/Phase-360-Portable-*-x64.exe
            desktop-dist/SHA256SUMS.txt
            desktop-dist/windows-verification.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  macos:
    name: Verify preview on macOS ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            nodeArchitecture: arm64
            runner: macos-15
          - architecture: x64
            nodeArchitecture: x64
            runner: macos-15-intel
    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          architecture: ${{ matrix.nodeArchitecture }}
          package-manager-cache: false

      - name: Validate preview tag and native runner
        shell: bash
        run: |
          node scripts/check-preview-tag.mjs "$GITHUB_REF_NAME"
          expected="${{ matrix.architecture }}"
          actual="$(uname -m)"
          if [[ "$expected" == "x64" ]]; then expected="x86_64"; fi
          [[ "$actual" == "$expected" ]]

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run complete test suite
        run: npm test

      - name: Ensure source tree remains clean
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          [[ -z "$(git ls-files --others --exclude-standard)" ]]

      - name: Build DMG and ZIP
        run: npm run desktop:dist:mac -- --${{ matrix.architecture }}

      - name: Verify packages natively
        run: >-
          node scripts/verify-macos-package.mjs
          --dist-dir desktop-dist
          --arch ${{ matrix.architecture }}
          --expected-signature unsigned

      - name: Upload verified macOS inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-macos-${{ matrix.architecture }}-${{ github.sha }}
          path: |
            desktop-dist/Phase-360-*-macOS-${{ matrix.architecture }}.dmg
            desktop-dist/Phase-360-*-macOS-${{ matrix.architecture }}.zip
            desktop-dist/SHA256SUMS-macos-${{ matrix.architecture }}.txt
            desktop-dist/macos-verification-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: Publish verified unsigned preview
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          architecture: x64
          package-manager-cache: false

      - name: Download verified Windows inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-windows-x64-${{ github.sha }}
          path: preview-input/windows

      - name: Download verified Apple Silicon inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-macos-arm64-${{ github.sha }}
          path: preview-input/macos-arm64

      - name: Download verified Intel Mac inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: preview-macos-x64-${{ github.sha }}
          path: preview-input/macos-x64

      - name: Reconcile hashes, manifests and source identity
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/prepare-preview-release.mjs \
            --input-root preview-input \
            --output-dir release-assets \
            --version "$version" \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA"

      - name: Confirm release does not already exist
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists and will not be overwritten."
            exit 1
          fi

      - name: Publish GitHub pre-release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          preview_number="${GITHUB_REF_NAME##*.}"
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "Phase 360 ${version} preview ${preview_number} (unsigned test build)" \
            --notes-file .github/release-notes/desktop-preview.md
